name: flow_note
description: FlowNote - 꽃 거래 장부 앱
publish_to: 'none'
version: 1.0.0+39

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 한국어 로컬라이제이션 (showDatePicker 등 Material 위젯의 한글 표시에 필요)
  flutter_localizations:
    sdk: flutter

  # State management
  provider: 6.1.5+1

  # Local storage
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0

  # Image picker (gallery)
  image_picker: 1.1.2

  # 영수증 사진 크롭 · 리사이즈 · 회전 (순수 Dart — 웹/앱 동일 코드)
  #
  # 🔴 예전에는 이 패키지를 넣지 않으려고 애썼다. 그때 이유는
  #    "네이티브에서 JPEG 를 다시 인코딩할 일이 없다" 였다.
  #    하지만 지금은 세 가지가 모두 이 패키지를 필요로 한다.
  #      1) 프리뷰를 BoxFit.cover 로 꽉 채우면 찍힌 JPEG 를 보이는
  #         영역으로 잘라야 한다 (안 자르면 화각이 또 어긋난다)
  #      2) 영수증만 남기는 크롭 기능
  #      3) 리사이즈(용량 줄이기) — 네이티브에는 수단이 아예 없었다
  #    이미 pubspec.lock 에 transitive 로 4.5.4 가 들어와 있었으므로
  #    APK 에 추가되는 무게는 없다. 직접 의존성으로만 올린다.
  image: 4.5.4

  # In-app camera (카메라 뷰 직접 제어)
  camera: 0.11.1

  # HTTP client (Gemini API 호출용)
  http: 1.5.0

  # Calendar UI
  table_calendar: 3.2.1

  # Intl / Date formatting
  intl: 0.20.2

  # UUID for unique IDs
  uuid: 4.5.1

  # Permission handler
  permission_handler: 11.4.0

  # Local push notifications (백그라운드 스캔 완료 알림)
  flutter_local_notifications: 18.0.1

  # EXIF rotation fix for receipt images
  exif: 3.3.0

  # Firebase (Flutter 3.44.7 호환 버전)
  firebase_core: 4.7.0
  cloud_firestore: 6.3.0
  firebase_storage: 13.0.0

  # 인증 — 이메일/비밀번호 + 구글 로그인 + 애플 로그인
  firebase_auth: 6.4.0
  google_sign_in: 6.2.2
  # 애플 로그인 (iOS 필수 — 소셜 로그인 제공 시 App Store 심사 요건)
  sign_in_with_apple: 6.1.3
  # 카카오 로그인.
  #
  # 🔴 2.0.0 을 쓰지 않는 이유
  #    2.0.0 은 Flutter >=3.38 을 요구한다. 우리는 3.35.5 라서 설치되지 않는다.
  #    1.10.0 이 3.22 이상 대응 마지막 버전이다.
  #
  # `_user` 만 넣는다. 카카오톡 공유·지도 등은 쓰지 않아서 통짜 패키지
  # (kakao_flutter_sdk) 를 넣으면 안 쓰는 코드가 APK 에 실려 나간다.
  kakao_flutter_sdk_user: 1.10.0
  crypto: ^3.0.6

  # 기기 고유 정보 (동의 이력에 기록)
  package_info_plus: 8.1.2

  # Icons
  cupertino_icons: ^1.0.8

  # Dotted border for scan UI
  dotted_border: 2.1.0

  # Shimmer loading
  shimmer: 3.0.0

  # Flutter SVG
  # 우리 코드에서 직접 쓰지 않는다 (SvgPicture 사용처 0곳).
  # kakao_flutter_sdk_user 가 ^2.2.1 을 요구해서 버전만 올렸다.
  flutter_svg: 2.3.0
  # 정산 문서(PDF) 생성.
  pdf: 3.11.3
  # PDF **미리보기**.
  #
  # 🔴 예전 주석에는 "printing 은 pdfium 네이티브 라이브러리를 끌고 들어와서
  #    APK 가 수 MB 커진다" 고 적어뒀는데, 소스를 열어보니 사실이 아니다.
  #    `printing-5.13.4/android/.../PrintingJob.java:26` 은
  #    `import android.graphics.pdf.PdfRenderer` — 안드로이드 5.0 부터 OS 에
  #    들어있는 기본 렌더러다. 번들되는 .so 는 없다.
  #    웹은 pdf.js 를 쓰는데, 기본값이 unpkg CDN 이라 오프라인/차단 환경에서
  #    미리보기가 죽는다. 그래서 `web/pdfjs/` 에 직접 넣고
  #    `web/index.html` 의 `dartPdfJsBaseUrl` 로 그쪽을 가리킨다.
  printing: 5.13.4
  path_provider: 2.1.5
  share_plus: 12.0.2

  # 브라우저 API (Blob / URL / <a download>).
  #
  # 웹에서 정산서 PDF 를 다운로드로 내려보내는 데만 쓴다.
  # `path_provider` 에 web 지원이 없어서(platforms: android/ios/linux/
  # macos/windows) 웹은 파일 시스템 대신 브라우저 다운로드를 써야 한다.
  # 이미 Flutter 가 transitive 로 1.1.1 을 쓰고 있어 추가 무게는 없다.
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: 2.0.1
  build_runner: 2.4.13

flutter:
  uses-material-design: true
  assets:
    # assets/images/ 를 뺐다 — 안에 있던 splash.png 는 어디서도 쓰이지
    # 않으면서 APK 에 155KB 를 싣고 나갔다. 부팅 스플래시는 asset 이
    # 아니라 android/.../mipmap-*/launch_image.png (네이티브) 를 쓴다.
    - assets/icons/
    - assets/icon/
    # 꽃 표준 이름 사전 (화훼공판장 경매 데이터 기반, 150품목/1084품종)
    - assets/data/flower_names.json
    - assets/data/flower_season.json

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
